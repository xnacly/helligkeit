[package]
name = "helligkeit"
version = "0.0.1-pre"
edition = "2024"
description = "Control device linux device brightness"
repository = "https://github.com/xnacly/helligkeit"
license = "MIT"
readme = "README.md"

categories = ["hardware-support"]
keywords = ["brightness", "led", "ddci", "linux"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
helligkeit-ddc = { path = "../helligkeit-ddc" }
helligkeit-edid = { path = "../helligkeit-edid" }
helligkeit-dev = { path = "../helligkeit-dev" }
helligkeit-shared = { path = "../helligkeit-shared" }

[build-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_mangen = "0.3.3"
